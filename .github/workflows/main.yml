name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        c_compiler: [gcc, clang]
        build_type: [Release]
        shared: [ON, OFF]
        omp: [ON]
        precision: ["Single", "Double"]
        utilities: [ON]
        hdf5: [ON, OFF]
        eas3: [ON]
        profiling: [ON]

        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        
        exclude:
          - hdf5: ON
            shared: ON
          - c_compiler: cl

    steps:
    - uses: actions/checkout@v4
    
    - name: Cache CMake Build Artifacts
      id: cache-build
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/build
          ~/.ccache
        # The key uniquely identifies the build configuration.
        # It includes: OS, Compiler, Build Type, HDF5 status, Shared status, 
        # AND the specific eas3/profiling flags.
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ matrix.hdf5 }}-${{ matrix.shared }}-eas3-${{ matrix.eas3 }}-prof-${{ matrix.profiling }}-${{ hashFiles('**/CMakeLists.txt', 'CMake/*.cmake') }}
        
        # Fallback keys: If an exact match isn't found, try to restore a cache 
        # with the same compiler and OS but different flags (less ideal but faster than full rebuild)
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Dependencies
      if: matrix.hdf5 == 'ON' || matrix.c_compiler == 'clang'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libhdf5-dev \
          libomp-dev

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=${{ matrix.shared }}
        -DBIGWHOOP_WITH_OPENMP=${{ matrix.omp }}
        -DBIGWHOOP_PRECISION:STRING=${{ matrix.precision }}
        -DBUILD_UTILITIES=${{ matrix.utilities }}
        -DBUILD_H5Z_BWC=${{ matrix.hdf5 }}
        -DBIGWHOOP_WITH_EAS3=${{ matrix.eas3 }}
        -DBIGWHOOP_WITH_PROFILING=${{ matrix.profiling }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel $(nproc)

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
